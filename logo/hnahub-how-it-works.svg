<rect x="40" y="86" width="62" height="42" rx="3" fill="#E9B872"/>
<rect x="66" y="86" width="10" height="16" fill="#C9711A"/>
<path d="M48 116 h16 M48 121 h10" stroke="#C98D63" stroke-width="2" stroke-linecap="round"/>
<!-- arrow to hub -->
<path d="M118 108 L144 108" stroke="#F28C1B" stroke-width="4" stroke-linecap="round"/>
<path d="M140 100 L150 108 L140 116" fill="none" stroke="#F28C1B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- 2. the hub (neighborhood shop) -->
<rect x="160" y="78" width="72" height="78" fill="#F4FAF6"/>
<rect x="156" y="62" width="80" height="18" rx="3" fill="#F28C1B"/>
<path d="M156 80 q5 8 10 0 q5 8 10 0 q5 8 10 0 q5 8 10 0 q5 8 10 0 q5 8 10 0 q5 8 10 0 q5 8 10 0 Z" fill="#F28C1B"/>
<path d="M166 62 v18 M186 62 v18 M206 62 v18 M226 62 v18" stroke="#FFD9A8" stroke-width="5"/>
<rect x="183" y="40" width="26" height="20" rx="4" fill="#013624"/>
<path d="M189 44 v12 M203 44 v12 M189 50 h14" stroke="#F28C1B" stroke-width="3" stroke-linecap="round"/>
<!-- counter window with stored boxes -->
<rect x="168" y="92" width="56" height="30" rx="3" fill="#013624"/>
<rect x="168" y="114" width="56" height="4" fill="#F28C1B"/>
<use href="#sbox" x="180" y="104" transform="scale(1)"/><use href="#sbox" x="198" y="104"/><use href="#sbox" x="214" y="106"/>
<rect x="168" y="128" width="56" height="28" fill="#0B5C3E"/>
<rect x="194" y="128" width="2" height="28" fill="#013624"/>
<!-- 3. small boxes go out to customers -->
<path d="M236 100 Q262 60 290 46" fill="none" stroke="#F28C1B" stroke-width="2.5" stroke-dasharray="5 5"/>
<path d="M236 112 L290 104" fill="none" stroke="#F28C1B" stroke-width="2.5" stroke-dasharray="5 5"/>
<path d="M236 124 Q262 150 290 160" fill="none" stroke="#F28C1B" stroke-width="2.5" stroke-dasharray="5 5"/>
<use href="#sbox" x="262" y="66" transform="rotate(-12 262 66)"/>
<use href="#sbox" x="264" y="108"/>
<use href="#sbox" x="262" y="146" transform="rotate(12 262 146)"/>
<!-- customers, each with one box -->
<use href="#person" x="318" y="44"/><use href="#sbox" x="338" y="44"/>
<use href="#person" x="318" y="104"/><use href="#sbox" x="338" y="104"/>
<use href="#person" x="318" y="158" transform="translate(0 -8)"/><use href="#sbox" x="338" y="152"/>
</svg>
