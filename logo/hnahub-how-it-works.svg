<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="HnaHub">
<defs>
<g id="sbox"><rect x="-9" y="-9" width="18" height="18" rx="2.5" fill="#F2C47E"/><rect x="-2.2" y="-9" width="4.4" height="6" fill="#C9711A"/><rect x="-9" y="-3.4" width="18" height="1.6" fill="#D9A55C"/></g>
<g id="person"><circle cx="0" cy="-17" r="8" fill="#F4FAF6"/><path d="M-13 12 Q-13 -6 0 -6 Q13 -6 13 12 Z" fill="#F4FAF6"/></g>
</defs>
<!-- ground -->
<rect x="6" y="156" width="348" height="3" rx="1.5" fill="#13684A"/>
