<path d="M-4 150 L30 136 Q38 133 44 136 L50 140 L20 156 L-4 160 Z" fill="#F28C1B"/>
<path d="M40 134 Q48 126 62 127 L96 128 Q103 129 102 135 Q101 140 94 140 L70 140 Q76 143 74 148 Q72 152 65 151 L46 149 Q38 147 36 141 Z" fill="#E7AE84"/>
<path d="M70 140 L88 140" stroke="#C98D63" stroke-width="2" stroke-linecap="round"/>
<path d="M66 146 L80 146" stroke="#C98D63" stroke-width="2" stroke-linecap="round"/>
<!-- big carton -->
<rect x="40" y="78" width="62" height="50" rx="3" fill="#E9B872"/>
<rect x="40" y="78" width="62" height="8" fill="#D9A55C"/>
<path d="M40 78 L26 66 L50 66 L58 78 Z" fill="#F2C47E"/>
<path d="M102 78 L116 66 L92 66 L84 78 Z" fill="#F2C47E"/>
