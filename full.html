<style>
/* Layout: one phone column, language + role switch on top, screens swap in place, tab bar per role; Darija runs right to left */
:root{
  --bg:#F5F6F3; --card:#FFFFFF; --line:#E2E6E1; --ink:#15241C; --muted:#56635B;
  --brand:#17694A; --brand-ink:#FFFFFF; --brand-soft:#E3F1EA;
  --amber:#D98A00; --amber-soft:#FCEBC8; --amber-ink:#6E4300;
  --violet-soft:#E6E8F7; --violet-ink:#3A3F8F;
  /* role colors: producer = honey (goods), rokna = green (the shop), livreur = blue (the road) */
  --rp:#B86E00; --rp-soft:#FCEBC8; --rp-ink:#6E4300; --rr:#17694A; --rr-soft:#E3F1EA; --rr-ink:#17694A; --rd:#2F5BA8; --rd-soft:#E3EAF7; --rd-ink:#24467F; --rv:#6B4FB3; --rv-soft:#EEE9FA; --rv-ink:#4B3590; --on-role:#FFFFFF;
  --display:"Space Grotesk", "Noto Kufi Arabic", "Segoe UI", system-ui, sans-serif;
  --body:Inter, "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --card:#17221C; --line:#2A3830; --ink:#EAF1EC; --muted:#A3B2A9;
  --brand:#3FA77A; --brand-ink:#08140E; --brand-soft:#1D3A2C;
  --amber:#E9A73A; --amber-soft:#3A2C12; --amber-ink:#F6D28F;
  --violet-soft:#262A4A; --violet-ink:#C3C7F5;
  --rp:#E9A73A; --rp-soft:#3A2C12; --rp-ink:#F6D28F; --rr:#3FA77A; --rr-soft:#1D3A2C; --rr-ink:#9FD9BC; --rd:#7EA6EC; --rd-soft:#1E2A42; --rd-ink:#BFD2F6; --rv:#B39DF0; --rv-soft:#2A2342; --rv-ink:#D7CCF8; --on-role:#0F1713; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1713; --card:#17221C; --line:#2A3830; --ink:#EAF1EC; --muted:#A3B2A9;
  --brand:#3FA77A; --brand-ink:#08140E; --brand-soft:#1D3A2C;
  --amber:#E9A73A; --amber-soft:#3A2C12; --amber-ink:#F6D28F;
  --violet-soft:#262A4A; --violet-ink:#C3C7F5;
  --rp:#E9A73A; --rp-soft:#3A2C12; --rp-ink:#F6D28F; --rr:#3FA77A; --rr-soft:#1D3A2C; --rr-ink:#9FD9BC; --rd:#7EA6EC; --rd-soft:#1E2A42; --rd-ink:#BFD2F6; --rv:#B39DF0; --rv-soft:#2A2342; --rv-ink:#D7CCF8; --on-role:#0F1713; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
[dir="rtl"] body{font-size:16px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 96px;gap:12px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.headbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.today{font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.seg{display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.roles{grid-template-columns:repeat(4,minmax(0,1fr));flex:none}
.langs{flex:0 0 auto;padding:3px!important;border-radius:12px!important}
.langs{grid-template-columns:repeat(2,auto)}
.seg button{min-height:40px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:600;color:var(--muted);padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet input[type=text],.sheet input[type=number]{background:var(--bg)}
.pickfield{min-height:52px;border:1.5px dashed var(--brand);border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;text-align:start;width:100%}
.pf-act{color:var(--brand);font-weight:700;font-size:13px;white-space:nowrap}
.roles{padding:3px;gap:3px;border-radius:12px;background:var(--card)}
.seg.roles button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;font-size:11.5px;line-height:1.15;border-radius:9px;padding:4px 2px}
.roles svg{width:16px;height:16px;flex-shrink:0}
.seg.roles button[data-role="producer"]{background:var(--rp-soft);color:var(--rp-ink)}
.seg.roles button[data-role="rokna"]{background:var(--rr-soft);color:var(--rr-ink)}
.seg.roles button[data-role="customer"]{background:var(--rd-soft);color:var(--rd-ink)}
.seg.roles button[data-role="vendor"]{background:var(--rv-soft);color:var(--rv-ink)}
.seg.roles button[data-role="vendor"][aria-pressed="true"]{background:var(--rv);color:var(--on-role)}
body[data-active-role="vendor"] .headbar{border-bottom:3px solid var(--rv)}
.seg.roles button[data-role="producer"][aria-pressed="true"]{background:var(--rp);color:var(--on-role)}
.seg.roles button[data-role="rokna"][aria-pressed="true"]{background:var(--rr);color:var(--on-role)}
.seg.roles button[data-role="customer"][aria-pressed="true"]{background:var(--rd);color:var(--on-role)}
body[data-active-role="producer"] .headbar{border-bottom:3px solid var(--rp)}
body[data-active-role="rokna"] .headbar{border-bottom:3px solid var(--rr)}
body[data-active-role="customer"] .headbar{border-bottom:3px solid var(--rd)}
.headbar{padding-bottom:6px}
.langbtn{display:grid;place-items:center;min-height:32px!important;min-width:40px;padding:0 6px!important}
.seg .langbtn[aria-pressed="true"]{background:var(--brand-soft);outline:2px solid var(--brand);outline-offset:-2px}
.flag{width:24px;height:16px;border-radius:2px;flex-shrink:0;outline:1px solid var(--line)}
.lname{display:flex;flex-direction:column;line-height:1.1;text-align:start}
.lname small{font-size:10px;font-weight:500;opacity:.75}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-family:var(--display);font-weight:700;font-size:24px;color:var(--brand);display:flex;align-items:center;gap:8px}.brand .hub{color:#E07F12}
.back{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex-shrink:0}
[dir="rtl"] .back svg{transform:scaleX(-1)}
h1{font-family:var(--display);font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:18px;margin:0}
.sub{font-size:13px;color:var(--muted)}
[dir="rtl"] .sub{font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.end{text-align:end}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.hl{border:2px solid var(--brand)}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero .k{font-size:13px;opacity:.85}.hero .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{min-height:48px;border-radius:24px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.ghost{background:transparent;border:1.5px solid var(--brand);color:var(--brand)}
.btn.plain{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.amber{background:var(--amber);color:#1B1200}
.btn.small{min-height:44px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.bar.low i{background:var(--amber)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap}
.p-green{background:var(--brand-soft);color:var(--brand)}
.p-amber{background:var(--amber-soft);color:var(--amber-ink)}
.p-violet{background:var(--violet-soft);color:var(--violet-ink)}
.p-grey{background:var(--line);color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
label{font-size:13px;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field .mini{font-size:12px;color:var(--muted);font-weight:500}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex-shrink:0;margin:0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.points{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=number]{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;width:100%;box-sizing:border-box}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{font-size:12px;color:var(--muted)}
[dir="rtl"] .note{font-size:13px}
.photo{border:2px dashed var(--brand);border-radius:14px;min-height:220px;display:grid;place-items:center;text-align:center;padding:16px;background:var(--card);overflow:hidden}
.photo img{max-width:100%;max-height:320px;border-radius:10px}
.stamp{font-size:12px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);

.tabs button[aria-current="page"]{color:var(--brand);font-weight:600}
.tabs svg{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 48px)}
.map{height:150px;border-radius:14px;background:var(--brand-soft);position:relative;overflow:hidden}
.map svg{width:100%;height:100%}
.step{display:flex;gap:12px;align-items:flex-start}
.dot{width:26px;height:26px;border-radius:13px;flex-shrink:0;display:grid;place-items:center;border:2px solid var(--amber);box-sizing:border-box}
.dot.done{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.num,.ltr{font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr}
.ltr{white-space:nowrap}
.msgs{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:var(--brand-soft);border-color:transparent}
.bubble.support{border:1.5px solid var(--amber)}
.bubble img{border-radius:10px;max-height:220px}
.bubble .meta{font-size:11px;color:var(--muted)}
.who{font-size:12px;font-weight:700;color:var(--amber-ink)}
.sys{align-self:center;font-size:12px;color:var(--muted);background:var(--line);padding:4px 10px;border-radius:10px;text-align:center;max-width:90%}
.voice{display:flex;align-items:center;gap:8px}
.wave{display:flex;gap:2px;align-items:center;height:20px}.wave i{width:3px;background:var(--brand);border-radius:2px}
.composer{display:flex;gap:8px;align-items:center;position:sticky;bottom:0;background:var(--bg);padding-block:8px calc(8px + env(safe-area-inset-bottom, 0px))}
.composer input[type=text]{flex:1;border-radius:22px;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;flex-shrink:0;cursor:pointer}
.iconbtn.send{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

    if(o.status==='proposed')detail=`<div class="card hl"><div class="sub">${L.c_proposed}</div>${rk}<button type="button" class="btn block" id="confirmPlace">${L.c_confirmPlace}</button></div>`;
    if(o.status==='todrop')detail=`<div class="card hl">${rk}<div class="note">${L.c_waitDrop}</div></div>`;
    if(o.status==='ready')detail=`<div class="card hl">${rk}<div class="note">${L.c_held(hoursLeft(o))}</div>

    const cancel=['new','proposed','todrop','ready'].includes(o.status)?`<button type="button" class="btn plain block" id="cCancel">${L.c_cancel}</button>`:'';
    return html+`<div class="row"><h2>${L.c_myOrder||''}<span class="ltr">#${o.id}</span> · ${o.qty} × ${esc(itemName(o))}</h2></div>

function kgOf(unit){const m=String(unit||'').replace(',','.').match(/(\d+(?:\.\d+)?)\s*(kg|كلغ|g|غ|ml|مل|l|ل)/i);if(!m)return null;const v=parseFloat(m[1]),k=m[2].toLowerCase();return ['kg','كلغ','l','ل'].includes(k)?v:v/1000;}
function openPack(){
  const L=t(),u=S.su,d=Object.assign({},u.pack),prevFocus=document.activeElement;
  const host=document.createElement('div');document.body.appendChild(host);
  const est=()=>{const k=kgOf(d.unit);return k&&d.perBox?Math.round(k*d.perBox*10)/10:null;};
  const estTxt=()=>{const e=est();return e?L.pk_est(e):L.pk_noEst;};
  const g=id=>host.querySelector('#'+id);
  const read=()=>{d.unit=g('pk_unit').value.trim();d.perBox=Number(g('pk_per').value)||0;d.L=g('pk_L').value;d.W=g('pk_W').value;d.H=g('pk_H').value;d.weight=g('pk_weight').value.trim();};
  const close=()=>{host.remove();document.removeEventListener('keydown',onKey);if(prevFocus&&prevFocus.focus)prevFocus.focus();};
  const onKey=e=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',onKey);
  const draw=first=>{
    host.innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pkTitle">
      <div class="row"><h2 id="pkTitle">${L.pk_title}</h2><button type="button" class="back" id="pkClose" aria-label="${L.pk_close}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="field"><span style="font-size:13px;font-weight:600">${L.pk_container}</span><div class="chips" role="group" aria-label="${L.pk_container}">${L.pk_containers.map((c,i)=>`<button type="button" class="chip" data-pkc="${i}" aria-pressed="${d.container===i}">${c}</button>`).join('')}</div></div>
      <div class="field"><label for="pk_unit">${L.pk_unit}</label><div class="chips" role="group" aria-label="${L.pk_unit}">${L.pk_units.map(c=>`<button type="button" class="chip" data-pku="${c}" aria-pressed="${d.unit===c}">${c}</button>`).join('')}</div><input id="pk_unit" type="text" placeholder="${L.pk_unitPh}" value="${esc(d.unit)}"></div>
      <div class="field"><label for="pk_per">${L.pk_perBox}</label><input id="pk_per" type="number" inputmode="numeric" min="1" value="${d.perBox||''}" dir="ltr"></div>
      <div class="field"><span style="font-size:13px;font-weight:600">${L.pk_box}</span><div class="grid3">
        <div class="field"><label class="mini" for="pk_L">${L.pk_L}</label><input id="pk_L" type="number" inputmode="numeric" value="${esc(d.L)}" dir="ltr"></div>
        <div class="field"><label class="mini" for="pk_W">${L.pk_W}</label><input id="pk_W" type="number" inputmode="numeric" value="${esc(d.W)}" dir="ltr"></div>
        <div class="field"><label class="mini" for="pk_H">${L.pk_H}</label><input id="pk_H" type="number" inputmode="numeric" value="${esc(d.H)}" dir="ltr"></div></div></div>
      <div class="field"><label for="pk_weight">${L.pk_weight}</label><input id="pk_weight" type="text" inputmode="decimal" value="${esc(d.weight)}" placeholder="${est()||''}" dir="ltr"><div class="note" id="pkEst">${estTxt()}</div></div>
      <div class="row"><button type="button" class="btn plain" id="pkCancel">${L.pk_cancel}</button><button type="button" class="btn" style="flex:1" id="pkSave">${L.pk_save}</button></div>
    </div></div>`;
    host.querySelector('.overlay').onclick=e=>{if(e.target===e.currentTarget)close();};
    g('pkClose').onclick=close;g('pkCancel').onclick=close;
    host.querySelectorAll('[data-pkc]').forEach(b=>b.onclick=()=>{read();d.container=Number(b.dataset.pkc);draw();});
    host.querySelectorAll('[data-pku]').forEach(b=>b.onclick=()=>{read();d.unit=b.dataset.pku;draw();});
    ['pk_unit','pk_per'].forEach(id=>g(id).addEventListener('input',()=>{read();g('pkEst').textContent=estTxt();g('pk_weight').placeholder=est()||'';host.querySelectorAll('[data-pku]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pku===d.unit)));}));
    g('pkSave').onclick=()=>{read();if(!d.weight&&est())d.weight=String(est());d.set=true;u.pack=d;close();render();};
    if(first)g('pkClose').focus();
  };
  draw(true);
}

function render(){
  const L=t();
  let r=(location.hash||'').slice(1); if(!screens[r]) r='producer';
  if(!S.registered && ROLE_OF[r]==='producer') r='signup';
  if(S.registered && r==='signup') r='producer';
  const role=r==='chat'?S.chatRole:ROLE_OF[r];
  document.documentElement.lang = lang==='fr'?'fr':'ary';
  document.documentElement.dir = lang==='fr'?'ltr':'rtl';
  document.body.dataset.activeRole = role;
  try{document.getElementById('today').textContent=new Intl.DateTimeFormat(lang==='fr'?'fr-MA':'ar-MA-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());}catch(e){document.getElementById('today').textContent=new Date().toLocaleDateString();}
  document.getElementById('rolesGroup').setAttribute('aria-label',L.roles);
  document.querySelectorAll('#rolesGroup [data-role]').forEach(b=>{b.innerHTML=ROLE_ICON[b.dataset.role]+`<span>${L['r_'+b.dataset.role]}</span>`;b.setAttribute('aria-pressed',String(b.dataset.role===role));});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  const html=screens[r](); if(html==='')return;
  view.innerHTML=`<div class="screen stack" style="gap:16px">${html}</div>`;
  const nav=document.getElementById('tabs');
  nav.setAttribute('aria-label',L.menu);
  nav.innerHTML=(r==='signup'||r==='chat')?'':TABS[role].map(([id,key,ic])=>`<button type="button" data-go="${id}" ${id===r||(id==='kellef'&&r==='annex')?'aria-current="page"':''}>${ic}${L[key]}</button>`).join('');
  bind(r);
}

function bind(r){
  const L=t();
  if(r==='signup'){
    const u=S.su;
    const save=()=>{['name','ice','city','phone','product','size','code'].forEach(k=>{const el=document.getElementById('su_'+k);if(el)u[k]=el.value.trim();});const ag=document.getElementById('su_agree');if(ag)u.agree=ag.checked;};
    view.querySelectorAll('#suForm input').forEach(i=>i.addEventListener('input',save));
    const ag=document.getElementById('su_agree');if(ag)ag.onchange=save;
    view.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{save();u.status=Number(b.dataset.status);render();});
    view.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{save();u.cat=Number(b.dataset.cat);render();});
    view.querySelectorAll('[data-sucond]').forEach(b=>b.onclick=()=>{save();const i=Number(b.dataset.sucond);u.conds=u.conds.includes(i)?u.conds.filter(x=>x!==i):[...u.conds,i];render();});
    const prev=document.getElementById('suPrev');if(prev)prev.onclick=()=>{save();u.step--;render();window.scrollTo(0,0);};
    const op=document.getElementById('openPack');if(op)op.onclick=()=>{save();openPack();};
    document.getElementById('suForm').addEventListener('submit',e=>{
      e.preventDefault();save();
      const ok=u.step===1?(u.name&&u.phone):u.step===2?u.product:(u.agree&&/^\d{4}$/.test(u.code));
      if(!ok){document.getElementById('suErr').hidden=false;return;}
      if(u.step<3){u.step++;render();window.scrollTo(0,0);return;}
      S.registered=true;go('kellef');window.scrollTo(0,0);toast(L.su_done);
    });
  }
  if(r==='chat'){
    const id=S.chatFor,me=S.chatRole,th=thread(id);
    const add=m=>{th.push(Object.assign({from:me,time:hm()},m));if(!S.waSent[id]){S.waSent[id]=true;th.push({from:'system',text:{ary:T.ary.waAlert,fr:T.fr.waAlert},time:hm()});}render();};
    view.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>add({type:'quick',key:b.dataset.q}));
    document.getElementById('chatForm').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('chatText').value.trim();if(v)add({type:'text',text:{raw:v}});});
    const ph=document.getElementById('chatPhoto');ph.onchange=()=>readPhoto(ph,src=>add({type:'photo',photo:src}));
    document.getElementById('voiceBtn').onclick=()=>{add({type:'voice',dur:'07'});toast(L.recHint);};
    const sp=document.getElementById('supportBtn');if(sp)sp.onclick=()=>{th.push({from:'system',text:{ary:T.ary.supportJoined,fr:T.fr.supportJoined},time:hm()},{from:'support',type:'text',text:{ary:T.ary.supportHello,fr:T.fr.supportHello},time:hm()});render();};
    requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight));
  }
  if(r==='producer'){
    document.getElementById('topup').onclick=()=>toast(L.topupToast);
    view.querySelectorAll('[data-propose]').forEach(b=>b.onclick=()=>{const [oid,rid]=b.dataset.propose.split('|');const o=S.orders.find(x=>x.id===oid);o.status='proposed';o.rokna=rid;render();toast(L.p_proposedToast);});
  }
  if(r==='kellef'){
    view.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{S.city=b.dataset.city;render();});
    view.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.draftShop=S.shops[S.city].find(s=>s.id===b.dataset.pick);go('annex');});
  }
  if(r==='annex'){
    view.querySelectorAll('[data-cond]').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true')));
    document.getElementById('annexForm').addEventListener('submit',e=>{
      e.preventDefault();
      const price=document.getElementById('price').value.trim();
      if(!price){document.getElementById('formErr').hidden=false;document.getElementById('price').focus();return;}
      const s=S.draftShop,qty=document.getElementById('qty').value||'0';
      const conds=[...view.querySelectorAll('[data-cond][aria-pressed="true"]')].map(b=>b.textContent).join('، ')||L.noCond;
      S.roknas=S.roknas.filter(x=>x.id!==s.id);
      S.roknas.push({id:s.id,name:s.name,city:S.city,stock:0,cap:Number(qty)||1,status:'pending'});
      S.request={id:s.id,qty,space:document.getElementById('space').value,conds,price};
      S.draftShop=null; go('producer'); toast(L.sentToast);
    });
  }
  if(r==='rokna'){
    const a=document.getElementById('accept'),d=document.getElementById('decline');
    if(a)a.onclick=()=>{const rk=S.roknas.find(x=>x.id===S.request.id);if(rk)rk.status='active';S.request=null;render();toast(L.acceptToast);};
    if(d)d.onclick=()=>{S.roknas=S.roknas.filter(x=>x.id!==S.request.id);S.request=null;render();toast(L.declineToast);};
    view.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{S.photoFor=b.dataset.photo;go('photo');});
    view.querySelectorAll('[data-got]').forEach(b=>b.onclick=()=>{const o=S.orders.find(x=>x.id===b.dataset.got);o.status='ready';o.heldUntil=Date.now()+48*3.6e6;render();toast(L.r_gotToast);});
    view.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{S.payFor=b.dataset.pay;go('pay');window.scrollTo(0,0);});
  }
  if(r==='photo'){
    const cam=document.getElementById('cam'),ok=document.getElementById('confirmPhoto');
    cam.onchange=()=>readPhoto(cam,src=>{document.getElementById('shot').innerHTML=`<img src="${src}" alt="">`;const st=document.getElementById('stampLine');st.innerHTML=`<span class="ltr">${stamp()}</span> · ${L.loc}`;st.hidden=false;ok.disabled=false;});
    ok.onclick=()=>{
      const rk=S.roknas.find(x=>x.id==='maarif');
      if(S.photoFor==='incoming'){const n=Number(document.getElementById('count').value)||0;S.incoming.counted=true;if(rk)rk.stock=Math.min(rk.cap,rk.stock+n);toast(n>=S.incoming.qty?L.gotToast(n):L.missToast(S.incoming.qty-n));}
      else{const o=S.orders.find(x=>x.id===S.photoFor);o.status='done';if(rk)rk.stock=Math.max(0,rk.stock-o.qty);toast(L.handedToast(o.id));}
      S.photoFor=null;go('rokna');
    };
  }
  if(r==='vendor'){
    view.querySelectorAll('[data-vpropose]').forEach(b=>b.onclick=()=>{const [oid,rid]=b.dataset.vpropose.split('|');const o=S.orders.find(x=>x.id===oid);o.status='proposed';o.rokna=rid;render();toast(L.p_proposedToast);});
    const ph=document.getElementById('v_photo');ph.onchange=()=>readPhoto(ph,src=>{const n=document.getElementById('v_name').value,pr=document.getElementById('v_price').value,q=document.getElementById('v_qty').value;S.vPhoto=src;render();document.getElementById('v_name').value=n;document.getElementById('v_price').value=pr;document.getElementById('v_qty').value=q;});
    document.getElementById('vForm').addEventListener('submit',e=>{
      e.preventDefault();
      const n=document.getElementById('v_name').value.trim(),pr=document.getElementById('v_price').value.trim(),q=Math.max(1,Number(document.getElementById('v_qty').value)||1);
      if(!n||!pr){document.getElementById('vErr').hidden=false;return;}
      S.items.push({id:'v'+Date.now(),seller:'vendor',name:{ary:n,fr:n},by:{ary:T.ary.c_fromVendor,fr:T.fr.c_fromVendor},price:pr,qty:q,photo:S.vPhoto});S.vPhoto=null;render();toast(L.v_posted);
    });
  }
  if(r==='pay'){
    document.getElementById('payForm').addEventListener('submit',e=>{
      e.preventDefault();
      const v=document.getElementById('ref').value.trim();
      if(v.replace(/[\s-]/g,'').length<6){document.getElementById('refErr').hidden=false;document.getElementById('ref').focus();return;}
      const o=S.orders.find(x=>x.id===S.payFor);o.ref=v;o.status='paid';S.payFor=null;go('rokna');toast(L.r_paidToast);
    });
  }
  if(r==='customer'){
    const q=d=>{S.cQty=Math.min(10,Math.max(1,S.cQty+d));render();};
    const m=document.getElementById('qMinus'),p=document.getElementById('qPlus');if(m)m.onclick=()=>q(-1);if(p)p.onclick=()=>q(1);
    view.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{const id='K-'+(S.nextId++);S.orders.unshift({id,item:b.dataset.order,qty:S.cQty,status:'new',rokna:null,ref:''});S.myOrder=id;S.cQty=1;render();toast(L.c_orderedToast);});
    const cp=document.getElementById('confirmPlace');if(cp)cp.onclick=()=>{const o=S.orders.find(x=>x.id===S.myOrder);if(sellerOf(o)==='vendor'){o.status='todrop';}else{o.status='ready';o.heldUntil=Date.now()+48*3.6e6;}render();toast(L.c_confirmedToast);};
    const cc=document.getElementById('cCancel');if(cc)cc.onclick=()=>{const o=S.orders.find(x=>x.id===S.myOrder);o.status='cancelled';render();toast(L.c_cancelled);};
  }
}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-chat]');
  if(c){e.preventDefault();const cur=(location.hash||'').slice(1);S.chatFor=c.dataset.chat;S.chatRole=ROLE_OF[cur]==='rokna'?'rokna':'producer';go('chat');return;}
  const b=e.target.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go);window.scrollTo(0,0);}
});
document.querySelectorAll('#rolesGroup [data-role]').forEach(b=>b.onclick=()=>{
  const cur=(location.hash||'').slice(1),rl=b.dataset.role;
  if(cur==='chat'&&S.chatFor==='maarif'&&(rl==='producer'||(rl==='rokna'))&&S.registered){S.chatRole=rl;render();return;}
  go(rl);window.scrollTo(0,0);
});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('kellefni-lang',lang);}catch(e){}render();});
window.addEventListener('hashchange',render);
render();
</script>
